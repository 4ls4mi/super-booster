name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Qt 6.8.3 and MinGW 13.1
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $qtRoot = Join-Path $env:RUNNER_TEMP 'Qt'
          python -m pip install 'aqtinstall==3.3.0'
          python -m aqt install-qt --outputdir $qtRoot windows desktop 6.8.3 win64_mingw --modules qtshadertools qtwebsockets
          python -m aqt install-tool --outputdir $qtRoot windows desktop tools_mingw1310 qt.tools.win64_mingw1310
          rustup target add x86_64-pc-windows-gnu

      - name: Compile, test, and deploy the Windows application
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $qt = (Join-Path $env:RUNNER_TEMP 'Qt/6.8.3/mingw_64').Replace('\', '/')
          $mingw = (Join-Path $env:RUNNER_TEMP 'Qt/Tools/mingw1310_64/bin').Replace('\', '/')
          $env:Path = "$mingw;$qt/bin;$env:Path"
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER = Join-Path $mingw 'gcc.exe'

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$qt" `
            "-DCMAKE_CXX_COMPILER=$mingw/g++.exe" `
            "-DCMAKE_RC_COMPILER=$mingw/windres.exe"
          cmake --build build
          cargo test --locked --target x86_64-pc-windows-gnu --manifest-path audio_core/Cargo.toml

          New-Item -ItemType Directory -Path dist/app | Out-Null
          Copy-Item -LiteralPath build/super_booster.exe -Destination dist/app/
          Copy-Item -LiteralPath build/super_booster_update_helper.exe -Destination dist/app/
          & "$qt/bin/windeployqt.exe" --release --no-patchqt --no-translations `
            --no-system-d3d-compiler --no-system-dxc-compiler --no-opengl-sw `
            --skip-plugin-types qmltooling,generic --qmldir qml dist/app/super_booster.exe
          @('[Paths]', 'Prefix=.', 'Plugins=.', 'QmlImports=qml') |
            Set-Content -LiteralPath dist/app/qt.conf -Encoding ascii
          Copy-Item -LiteralPath third-party -Destination dist/app/ -Recurse

      - name: Prepare verified Inno Setup 7.1.1
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $directory = Join-Path $env:RUNNER_TEMP 'InnoSetup-7.1.1'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe'
          $expected = '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -cne $expected) {
            throw 'The Inno Setup download does not match the release checksum.'
          }
          $options = @(
            '/PORTABLE=1', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NOICONS', '/NORESTART',
            ('/DIR="{0}"' -f $directory)
          )
          $setup = Start-Process -FilePath $archive -ArgumentList $options -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or -not (Test-Path -LiteralPath "$directory/ISCC.exe" -PathType Leaf)) {
            throw "Preparing Inno Setup failed with exit code $($setup.ExitCode)."
          }

      - name: Package and verify the installer
        id: package
        run: |
          $metadata = Get-Content -LiteralPath CMakeLists.txt -Raw
          if ($metadata -notmatch '(?m)^project\(super_booster VERSION (\d+\.\d+\.\d+)\b') {
            throw 'Could not read the Super Booster version from CMakeLists.txt.'
          }
          $version = $Matches[1]
          $compiler = Join-Path $env:RUNNER_TEMP 'InnoSetup-7.1.1/ISCC.exe'
          $installer = ./packaging/Build-Installer.ps1 -StageDirectory dist/app -OutputDirectory dist `
            -Version $version -IsccPath $compiler | Select-Object -Last 1
          ./packaging/Verify-WindowsRelease.ps1 -InstallerPath $installer.FullName `
            -StageDirectory (Resolve-Path -LiteralPath dist/app).Path `
            -TempBase (Join-Path $env:RUNNER_TEMP 'super-booster-verification')
          ./packaging/Verify-UpdateHandoff.ps1 -InstallerPath $installer.FullName `
            -StageDirectory (Resolve-Path -LiteralPath dist/app).Path `
            -TempBase (Join-Path $env:RUNNER_TEMP 'super-booster-update-verification')

          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          $digest = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          "Verified $($installer.Name) · SHA-256 $digest" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload verified Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SuperBooster-${{ steps.package.outputs.version }}-windows-x64
          path: ${{ steps.package.outputs.installer }}
          compression-level: 0
          if-no-files-found: error


